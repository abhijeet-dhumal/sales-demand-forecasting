# Ray/KubeRay config for distributed get_historical_features()
#
# Used by TrainJob for distributed point-in-time joins.
# The Trainer worker copies this into a private temporary config directory
# before loading Feast; it does not overwrite the shared feature_store.yaml.
#
# Prerequisites:
# - RayCluster "{{RAY_CLUSTER_NAME}}" running in same namespace
# - ServiceAccount with RBAC to access RayCluster
# - CodeFlare SDK auth environment variables set

project: {{FEAST_PROJECT}}
provider: local

registry:
  registry_type: sql
  path: "${POSTGRES_PY_URL}"
  cache_ttl_seconds: {{FEAST_REGISTRY_CACHE_TTL_SECONDS}}

# Ray offline store - connects to KubeRay cluster
offline_store:
  type: ray
  storage_path: {{RAY_STORAGE_PATH}}
  use_kuberay: true
  kuberay_conf:
    cluster_name: {{RAY_CLUSTER_NAME}}
    namespace: {{DEMO_NAMESPACE}}
    skip_tls: false
  broadcast_join_threshold_mb: 100
  enable_distributed_joins: true
  enable_ray_logging: true

# Feast's Ray compute engine executes point-in-time joins and batch transforms.
batch_engine:
  type: ray.engine
  use_kuberay: true
  kuberay_conf:
    cluster_name: {{RAY_CLUSTER_NAME}}
    namespace: {{DEMO_NAMESPACE}}
    skip_tls: false
  max_workers: 2
  max_parallelism_multiplier: 1
  broadcast_join_threshold_mb: 25
  target_partition_size_mb: 16
  enable_ray_logging: true

online_store:
  type: postgres
  host: {{POSTGRES_HOST}}
  port: {{POSTGRES_PORT}}
  database: {{POSTGRES_DATABASE}}
  user: "{{POSTGRES_USERNAME}}"
  password: "${POSTGRES_PASSWORD}"

entity_key_serialization_version: {{FEAST_ENTITY_KEY_SERIALIZATION_VERSION}}






