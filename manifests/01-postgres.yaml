# PostgreSQL - Feast metadata database
#
# PRODUCTION NOTE: Replace this Secret with:
# - External Secrets Operator (AWS Secrets Manager, HashiCorp Vault)
# - Sealed Secrets
# - SOPS encrypted secrets
#
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{POSTGRES_SERVICE}}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: feast-mlops
type: Opaque
stringData:
  host: "{{POSTGRES_HOST}}"
  port: "{{POSTGRES_PORT}}"
  username: "{{POSTGRES_USERNAME}}"
  password: "{{POSTGRES_PASSWORD}}"
  admin-username: "{{POSTGRES_ADMIN_USERNAME}}"
  admin-password: "{{POSTGRES_ADMIN_PASSWORD}}"
  database: "{{POSTGRES_DATABASE}}"
  url: "{{POSTGRES_URL}}"
  py-url: "{{POSTGRES_PY_URL}}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{POSTGRES_DATA_PVC_NAME}}
  namespace: {{DEMO_NAMESPACE}}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{POSTGRES_PVC_SIZE}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{POSTGRES_SERVICE}}
  namespace: {{DEMO_NAMESPACE}}
spec:
  selector:
    app: {{POSTGRES_SERVICE}}
  ports:
  - port: {{POSTGRES_PORT}}
    targetPort: {{POSTGRES_PORT}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{POSTGRES_SERVICE}}
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{POSTGRES_SERVICE}}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: feast-mlops
spec:
  replicas: {{POSTGRES_REPLICAS}}
  strategy:
    type: Recreate  # Required for RWO PVC
  selector:
    matchLabels:
      app: {{POSTGRES_SERVICE}}
  template:
    metadata:
      labels:
        app: {{POSTGRES_SERVICE}}
        app.kubernetes.io/name: {{POSTGRES_SERVICE}}
    spec:
      containers:
      - name: {{POSTGRES_SERVICE}}
        image: {{POSTGRES_IMAGE}}
        ports:
        - containerPort: {{POSTGRES_PORT}}
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRESQL_DATABASE
          value: "{{POSTGRES_DATABASE}}"
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: admin-password
        volumeMounts:
        - name: {{POSTGRES_DATA_PVC_NAME}}
          mountPath: /var/lib/pgsql/data
        resources:
          requests:
            cpu: {{POSTGRES_CPU_REQUEST}}
            memory: {{POSTGRES_MEMORY_REQUEST}}
          limits:
            cpu: {{POSTGRES_CPU_LIMIT}}
            memory: {{POSTGRES_MEMORY_LIMIT}}
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: {{POSTGRES_DATA_PVC_NAME}}
        persistentVolumeClaim:
          claimName: {{POSTGRES_DATA_PVC_NAME}}
---
