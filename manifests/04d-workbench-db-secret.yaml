# Notebook 01 retrieves DB connection values through the in-cluster API.
# Keep access scoped to the one application Secret.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sales-forecast-workbench-db-secret
  namespace: {{DEMO_NAMESPACE}}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["postgres-secret"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-forecast-workbench-db-secret
  namespace: {{DEMO_NAMESPACE}}
subjects:
- kind: ServiceAccount
  name: {{WORKBENCH_SERVICE_ACCOUNT}}
  namespace: {{DEMO_NAMESPACE}}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sales-forecast-workbench-db-secret
