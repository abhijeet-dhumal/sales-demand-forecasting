# Least-privilege permissions for the Workbench service account used by the notebooks.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sales-forecast-workbench
  namespace: {{DEMO_NAMESPACE}}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["{{SERVE_CONFIGMAP_NAME}}"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["trainer.kubeflow.org"]
  resources: ["trainjobs"]
  verbs: ["create", "get"]
- apiGroups: ["trainer.kubeflow.org"]
  resources: ["trainingruntimes"]
  resourceNames: ["{{WORKBENCH_TRAINING_RUNTIME}}"]
  verbs: ["get"]
- apiGroups: ["serving.kserve.io"]
  resources: ["inferenceservices"]
  verbs: ["create"]
- apiGroups: ["serving.kserve.io"]
  resources: ["inferenceservices"]
  resourceNames: ["{{MODEL_NAME}}"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sales-forecast-workbench
  namespace: {{DEMO_NAMESPACE}}
subjects:
- kind: ServiceAccount
  name: {{WORKBENCH_SERVICE_ACCOUNT}}
  namespace: {{DEMO_NAMESPACE}}
roleRef:
  kind: Role
  name: sales-forecast-workbench
  apiGroup: rbac.authorization.k8s.io
---
# TrainerClient resolves ClusterTrainingRuntime objects by cluster-scoped GET.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sales-forecast-runtime-reader
rules:
- apiGroups: ["trainer.kubeflow.org"]
  resources: ["clustertrainingruntimes"]
  resourceNames: ["{{WORKBENCH_TRAINING_RUNTIME}}"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sales-forecast-runtime-reader
subjects:
- kind: ServiceAccount
  name: {{WORKBENCH_SERVICE_ACCOUNT}}
  namespace: {{DEMO_NAMESPACE}}
roleRef:
  kind: ClusterRole
  name: sales-forecast-runtime-reader
  apiGroup: rbac.authorization.k8s.io
