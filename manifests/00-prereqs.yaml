# Namespace and Prerequisites
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{DEMO_NAMESPACE}}
  labels:
    app.kubernetes.io/name: feast-mlops
---
# Shared storage for notebooks, feature_repo, and data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{SHARED_PVC_NAME}}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{SHARED_STORAGE_CLASS}}
  resources:
    requests:
      storage: {{SHARED_PVC_SIZE}}
