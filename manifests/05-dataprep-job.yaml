# Feast Feature Store Setup (Data Preparation)
# 
# This Job prepares the Feast Feature Store:
# 1. Generates sales data (parquet files)
# 2. Creates Feast project with TWO configs:
#    - feature_store.yaml (file-based) - for apply/materialize
#    - feature_store_ray.yaml (Ray) - for training's get_historical_features()
# 3. feast apply - registers features to PostgreSQL registry
# 4. feast materialize-incremental - populates online store
# 5. Tests online feature retrieval
#
# Feast batch processing uses the demo KubeRay cluster for materialization.
#
# NOTE: get_historical_features() is called in Training Job using Ray config
#
# Architecture:
# - Registry: PostgreSQL (SQL-based, durable)
# - Offline Store: File (apply/materialize) | Ray (training)
# - Online Store: PostgreSQL (low-latency serving)
#
apiVersion: batch/v1
kind: Job
metadata:
  name: {{DATAPREP_JOB_NAME}}
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app: {{DATAPREP_JOB_NAME}}
    pipeline: {{MLFLOW_EXPERIMENT_NAME}}
    component: {{DATAPREP_COMPONENT}}
spec:
  backoffLimit: {{DATAPREP_JOB_BACKOFF_LIMIT}}
  ttlSecondsAfterFinished: {{DATAPREP_JOB_TTL_SECONDS}}
  template:
    metadata:
      labels:
        app: {{DATAPREP_JOB_NAME}}
        pipeline: {{MLFLOW_EXPERIMENT_NAME}}
    spec:
      serviceAccountName: {{FEAST_SERVICE_ACCOUNT}}
      restartPolicy: Never
      # Init container installs dependencies once
      initContainers:
      - name: install-deps
        image: {{RAY_IMAGE}}
        command:
        - pip
        - install
        - --target=/pylibs
        - -q
        - feast[postgres,ray]=={{FEAST_CLIENT_VERSION}}
        - ray=={{RAY_VERSION}}
        - codeflare-sdk=={{CODEFLARE_SDK_VERSION}}
        - psycopg2-binary=={{PSYCOPG2_BINARY_VERSION}}
        volumeMounts:
        - name: pylibs
          mountPath: /pylibs
      containers:
      - name: {{RAY_CLUSTER_NAME}}
        image: {{RAY_IMAGE}}
        resources:
          requests:
            cpu: "{{DATAPREP_CPU_REQUEST}}"
            memory: "{{DATAPREP_MEMORY_REQUEST}}"
          limits:
            cpu: "{{DATAPREP_CPU_LIMIT}}"
            memory: "{{DATAPREP_MEMORY_LIMIT}}"
        env:
        - name: PYTHONPATH
          value: /pylibs
        - name: PATH
          value: /pylibs/bin:/usr/local/bin:/usr/bin:/bin
        - name: POSTGRES_HOST
          value: "{{POSTGRES_HOST}}"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: url
        - name: POSTGRES_PY_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: py-url
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: FEAST_RAY_USE_KUBERAY
          value: "true"
        - name: FEAST_RAY_CLUSTER_NAME
          value: "{{RAY_CLUSTER_NAME}}"
        - name: FEAST_RAY_NAMESPACE
          value: "{{DEMO_NAMESPACE}}"
        - name: FEAST_RAY_SKIP_TLS
          value: "false"
        - name: DATA_DIR
          value: "{{DATA_DIR}}"
        - name: FEAST_DATA_ROOT
          value: "{{DATA_DIR}}"
        - name: FEATURE_REPO_DIR
          value: "{{FEATURE_REPO_DIR}}"
        - name: DATA_CONFIG
          value: '{"start_date": "{{DATA_START_DATE}}", "weeks": {{NUM_WEEKS}}, "stores": {{NUM_STORES}}, "departments": {{NUM_DEPARTMENTS}}, "seed": {{RANDOM_SEED}}, "holiday_weeks": [{{DATA_HOLIDAY_WEEKS}}], "seasonal_amplitude": {{DATA_SEASONAL_AMPLITUDE}}, "seasonal_period_weeks": {{DATA_SEASONAL_PERIOD_WEEKS}}, "sales_base": {{DATA_SALES_BASE}}, "sales_per_store": {{DATA_SALES_PER_STORE}}, "sales_dept_base": {{DATA_SALES_DEPT_BASE}}, "sales_per_dept": {{DATA_SALES_PER_DEPT}}, "holiday_sales_multiplier": {{DATA_HOLIDAY_SALES_MULTIPLIER}}, "sales_noise_std": {{DATA_SALES_NOISE_STD}}, "temperature_base": {{DATA_TEMPERATURE_BASE}}, "temperature_amplitude": {{DATA_TEMPERATURE_AMPLITUDE}}, "temperature_noise_std": {{DATA_TEMPERATURE_NOISE_STD}}, "fuel_price_base": {{DATA_FUEL_PRICE_BASE}}, "fuel_price_variation": {{DATA_FUEL_PRICE_VARIATION}}, "cpi_base": {{DATA_CPI_BASE}}, "cpi_weekly_change": {{DATA_CPI_WEEKLY_CHANGE}}, "unemployment_base": {{DATA_UNEMPLOYMENT_BASE}}, "unemployment_noise_std": {{DATA_UNEMPLOYMENT_NOISE_STD}}, "store_types": "{{DATA_STORE_TYPES}}", "store_size_base": {{DATA_STORE_SIZE_BASE}}, "store_size_step": {{DATA_STORE_SIZE_STEP}}, "stores_per_region": {{DATA_STORES_PER_REGION}}}'
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: pylibs
          mountPath: /pylibs
        - name: shared-data
          mountPath: {{POD_SHARED_ROOT}}
        - name: scripts
          mountPath: /scripts
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "============================================================"
          echo "🍕 FEAST + RAY DISTRIBUTED FEATURE ENGINEERING"
          echo "============================================================"
          
          # Setup in-cluster auth for CodeFlare SDK
          export FEAST_RAY_AUTH_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          export FEAST_RAY_AUTH_SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          echo "🔐 In-cluster auth configured"
          
          # Run Feast workflow
          bash /scripts/run.sh
      volumes:
      - name: pylibs
        emptyDir: {}
      - name: shared-data
        persistentVolumeClaim:
          claimName: {{SHARED_PVC_NAME}}
      - name: scripts
        configMap:
          name: {{DATAPREP_JOB_NAME}}-scripts
---
# ConfigMap with all Feast + Ray scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{DATAPREP_JOB_NAME}}-scripts
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app: {{DATAPREP_JOB_NAME}}
    pipeline: {{MLFLOW_EXPERIMENT_NAME}}
data:
  # Feast Feature Store Configuration
  # File-based offline store for feast apply/materialize
  # Training Job uses feature_store_ray.yaml for get_historical_features()
  #
  feature_store.yaml: |
    project: {{FEAST_PROJECT}}
    provider: local
    
    registry:
      registry_type: sql
      path: "${POSTGRES_PY_URL}"
      cache_ttl_seconds: {{FEAST_REGISTRY_CACHE_TTL_SECONDS}}
    
    # File-based offline store (stable for apply/materialize)
    offline_store:
      type: file
    
    # PostgreSQL online store for low-latency serving
    online_store:
      type: postgres
      host: {{POSTGRES_HOST}}
      port: {{POSTGRES_PORT}}
      database: {{POSTGRES_DATABASE}}
      user: "{{POSTGRES_USERNAME}}"
      password: "${POSTGRES_PASSWORD}"

    # Feast computes distributed historical features/materialization on KubeRay.
    batch_engine:
      type: ray.engine
      use_kuberay: true
      kuberay_conf:
        cluster_name: "{{RAY_CLUSTER_NAME}}"
        namespace: "{{DEMO_NAMESPACE}}"
        skip_tls: false
      max_workers: 2
      max_parallelism_multiplier: 1
      broadcast_join_threshold_mb: 25
      target_partition_size_mb: 16
      enable_ray_logging: true
    
    entity_key_serialization_version: {{FEAST_ENTITY_KEY_SERIALIZATION_VERSION}}
  
  # Ray-enabled config (used by Training Job for get_historical_features)
  feature_store_ray.yaml: |
    project: {{FEAST_PROJECT}}
    provider: local
    
    registry:
      registry_type: sql
      path: "${POSTGRES_PY_URL}"
      cache_ttl_seconds: {{FEAST_REGISTRY_CACHE_TTL_SECONDS}}
    
    # Ray offline store in KubeRay mode (for distributed historical retrieval)
    offline_store:
      type: ray
      storage_path: {{RAY_STORAGE_PATH}}
      use_kuberay: true
      kuberay_conf:
        cluster_name: "{{RAY_CLUSTER_NAME}}"
        namespace: "{{DEMO_NAMESPACE}}"
        skip_tls: false
      broadcast_join_threshold_mb: 100
      enable_distributed_joins: true
      enable_ray_logging: true

    # Ray execution engine performs Feast point-in-time joins on KubeRay.
    batch_engine:
      type: ray.engine
      use_kuberay: true
      kuberay_conf:
        cluster_name: "{{RAY_CLUSTER_NAME}}"
        namespace: "{{DEMO_NAMESPACE}}"
        skip_tls: false
      max_workers: 2
      max_parallelism_multiplier: 1
      broadcast_join_threshold_mb: 25
      target_partition_size_mb: 16
      enable_ray_logging: true
    
    online_store:
      type: postgres
      host: {{POSTGRES_HOST}}
      port: {{POSTGRES_PORT}}
      database: {{POSTGRES_DATABASE}}
      user: "{{POSTGRES_USERNAME}}"
      password: "${POSTGRES_PASSWORD}"
    
    entity_key_serialization_version: {{FEAST_ENTITY_KEY_SERIALIZATION_VERSION}}

  # Feast definitions for the one-week-ahead forecast contract
  features.py: |
    """Feast definitions for one-week-ahead sales forecasts."""
    from datetime import timedelta
    from feast import Entity, FeatureView, Field, FileSource, FeatureService
    from feast.on_demand_feature_view import on_demand_feature_view
    from feast.types import Float32, Int32, Int64, String
    
    # Entities
    store = Entity(name="store_id", join_keys=["store_id"], description="Store identifier")
    department = Entity(name="dept_id", join_keys=["dept_id"], description="Department identifier")
    
    # Sales features - optimized schema (pre-sorted for fast PIT joins)
    sales_features = FeatureView(
        name="sales_features",
        description="Target-week rows with strictly prior sales history",
        entities=[store, department],
        ttl=timedelta(days=90),
        schema=[
            # Target
            Field(name="weekly_sales", dtype=Float32, description="Weekly sales ($)"),
            # Lags and rolling fields use observations strictly before target week.
            Field(name="lag_1", dtype=Float32, description="Sales from forecast origin week"),
            Field(name="lag_2", dtype=Float32, description="Sales 2 weeks ago"),
            Field(name="lag_4", dtype=Float32, description="Sales 4 weeks ago"),
            Field(name="lag_8", dtype=Float32, description="Sales 8 weeks ago"),
            # Rolling statistics (28% importance)
            Field(name="rolling_mean_4w", dtype=Float32, description="Prior four weeks through origin"),
            Field(name="rolling_std_4w", dtype=Float32, description="Prior four-week sales volatility"),
            Field(name="sales_vs_avg", dtype=Float32, description="Origin sales relative to prior four-week mean"),
            # Temporal features (18% importance)
            Field(name="week_of_year", dtype=Int32, description="Week 1-52"),
            Field(name="month", dtype=Int32, description="Month 1-12"),
            Field(name="quarter", dtype=Int32, description="Quarter 1-4"),
            Field(name="week_of_month", dtype=Int32, description="Week 1-5 within month"),
            Field(name="is_month_end", dtype=Int32, description="Last week of month"),
            # Holiday features (10% importance)
            Field(name="is_holiday", dtype=Int32, description="Holiday week indicator"),
            Field(name="days_to_holiday", dtype=Int32, description="Days to next holiday"),
            Field(name="origin_week", dtype=String, description="Last week available at forecast time"),
            Field(name="target_week", dtype=String, description="Week being forecast"),
        ],
        source=FileSource(path="{{DATA_DIR}}/sales_features.parquet", timestamp_field="event_timestamp"),
        online=True,
        tags={"team": "demand-forecasting", "version": "one-week-ahead-v1"},
    )
    
    # Store features - static dimensions
    store_features = FeatureView(
        name="store_features",
        description="Store metadata (slowly changing dimensions)",
        entities=[store, department],
        ttl=None,
        schema=[
            Field(name="store_index", dtype=Int32, description="Numeric store identifier supplied as a model input"),
            Field(name="department_index", dtype=Int32, description="Numeric department identifier supplied as a model input"),
            Field(name="store_type", dtype=String, description="Store type (A/B/C)"),
            Field(name="store_size", dtype=Int32, description="Store size (sqft)"),
            Field(name="region", dtype=String, description="Geographic region"),
        ],
        source=FileSource(path="{{DATA_DIR}}/store_features.parquet", timestamp_field="event_timestamp"),
        online=True,
        tags={"team": "demand-forecasting"},
    )
    
    # === FEATURE SERVICES ===
    
    # Training: optimized feature set (includes target)
    training_features = FeatureService(
        name="training_features",
        description="One-week-ahead training rows with a separate target label",
        features=[
            sales_features[[
                "weekly_sales",
                "lag_1", "lag_2", "lag_4", "lag_8",
                "rolling_mean_4w", "rolling_std_4w", "sales_vs_avg",
                "week_of_year", "month", "quarter", "week_of_month", "is_month_end",
                "is_holiday", "days_to_holiday",
                "origin_week", "target_week",
            ]],
            store_features[["store_index", "department_index", "store_size"]],
        ],
        tags={"stage": "training", "version": "one-week-ahead-v1"},
    )
    
    # Inference has the same model features and week metadata, but no label.
    inference_features = FeatureService(
        name="inference_features",
        description="Forecast features with target-week metadata",
        features=[
            sales_features[[
                "lag_1", "lag_2", "lag_4", "lag_8",
                "rolling_mean_4w", "rolling_std_4w", "sales_vs_avg",
                "week_of_year", "month", "quarter", "week_of_month", "is_month_end",
                "is_holiday", "days_to_holiday",
                "origin_week", "target_week",
            ]],
            store_features[["store_index", "department_index", "store_size"]],
        ],
        tags={"stage": "inference", "version": "one-week-ahead-v1"},
    )

  forecast_contract.py: |
@@FORECAST_CONTRACT_SOURCE@@

  # Data generator - Optimized feature engineering
  data_generator.py: |
    """
    Optimized Sales Data Generator with High-Impact Features
    
    Features generated (by importance):
    - Lag features (35%): lag_1, lag_2, lag_4, lag_8
    - Rolling stats (28%): rolling_mean_4w, rolling_std_4w, sales_vs_avg
    - Temporal (18%): week_of_year, month, quarter, week_of_month, is_month_end
    - Holiday (10%): is_holiday, days_to_holiday
    - Economic (7%): temperature, fuel_price, cpi, unemployment
    
    Data is PRE-SORTED by (store_id, dept_id, event_timestamp) for fast PIT joins!
    """
    import os
    import sys
    import json
    import pandas as pd
    import numpy as np
    from datetime import datetime, timedelta, timezone
    from pathlib import Path

    sys.path.insert(0, "/scripts")
    from forecast_contract import build_forecast_frame
    
    print("🚀 Optimized Feature Engineering Pipeline")
    print("=" * 60)
    
    config = json.loads(os.environ["DATA_CONFIG"])
    data_dir = os.getenv("DATA_DIR", "{{DATA_DIR}}")
    
    np.random.seed(config["seed"])
    base_date = datetime.fromisoformat(config["start_date"]).replace(tzinfo=timezone.utc)
    
    # Holiday weeks and synthetic data settings come from the project .env.
    MAJOR_HOLIDAYS = {int(week): "retail holiday" for week in config["holiday_weeks"]}
    
    print(f"📊 Generating data: {config['weeks']} weeks × {config['stores']} stores × {config['departments']} depts")
    
    records = []
    for week in range(config["weeks"]):
        week_date = base_date + timedelta(weeks=week)
        week_of_year = (week_date.isocalendar()[1])  # Actual week of year 1-52
        month = week_date.month
        quarter = (month - 1) // 3 + 1
        
        # Week of month (1-5)
        day_of_month = week_date.day
        week_of_month = min(5, (day_of_month - 1) // 7 + 1)
        
        # Is month end (last 7 days)
        next_month = (week_date.replace(day=28) + timedelta(days=4)).replace(day=1)
        days_until_month_end = (next_month - week_date).days
        is_month_end = int(days_until_month_end <= 7)
        
        # Holiday features
        is_holiday = int(week_of_year in MAJOR_HOLIDAYS)
        
        # Days to next holiday
        days_to_holiday = 365
        for hw in MAJOR_HOLIDAYS.keys():
            days_diff = (hw - week_of_year) % 52
            if days_diff > 0:
                days_to_holiday = min(days_to_holiday, days_diff * 7)
        
        # Seasonal and holiday multipliers
        seasonal = 1 + config["seasonal_amplitude"] * np.sin(2 * np.pi * week_of_year / config["seasonal_period_weeks"])
        holiday_boost = config["holiday_sales_multiplier"] if is_holiday else 1.0
        
        for store_id in range(1, config["stores"] + 1):
            store_base = config["sales_base"] + store_id * config["sales_per_store"]
            for dept_id in range(1, config["departments"] + 1):
                dept_factor = config["sales_dept_base"] + dept_id * config["sales_per_dept"]
                noise = np.random.normal(0, config["sales_noise_std"])
                
                records.append({
                    "store_id": store_id,
                    "dept_id": dept_id,
                    "event_timestamp": week_date,
                    "weekly_sales": round(max(0, store_base * dept_factor * seasonal * holiday_boost + noise), 2),
                    # Temporal features
                    "week_of_year": week_of_year,
                    "month": month,
                    "quarter": quarter,
                    "week_of_month": week_of_month,
                    "is_month_end": is_month_end,
                    # Holiday features
                    "is_holiday": is_holiday,
                    "days_to_holiday": days_to_holiday,
                    # Economic indicators
                    "temperature": round(config["temperature_base"] + config["temperature_amplitude"] * np.sin(2 * np.pi * week_of_year / config["seasonal_period_weeks"]) + np.random.normal(0, config["temperature_noise_std"]), 1),
                    "fuel_price": round(config["fuel_price_base"] + config["fuel_price_variation"] * np.random.random(), 2),
                    "cpi": round(config["cpi_base"] + week * config["cpi_weekly_change"], 1),
                    "unemployment": round(config["unemployment_base"] + np.random.normal(0, config["unemployment_noise_std"]), 1)
                })
    
    Path(data_dir).mkdir(parents=True, exist_ok=True)
    
    # Create DataFrame and SORT for fast PIT joins
    print("📦 Building DataFrame and sorting for fast PIT joins...")
    sales_df = pd.DataFrame(records)
    sales_df = sales_df.sort_values(["store_id", "dept_id", "event_timestamp"]).reset_index(drop=True)
    
    # Align each target week with the prior week's origin and prior-only history.
    print("⏱️  Computing leakage-safe one-week-ahead features...")
    sales_df = build_forecast_frame(sales_df)
    valid_rows = sales_df.dropna(subset=["lag_8", "rolling_mean_4w"]).shape[0]
    print(f"   Valid training rows (with 8-week history): {valid_rows:,} ({100*valid_rows/len(sales_df):.1f}%)")
    
    # Save parquet files (pre-sorted for fast PIT joins)
    print("💾 Saving parquet files (pre-sorted)...")
    sales_df.to_parquet(f"{data_dir}/sales_features.parquet", index=False)
    
    # Also save as features.parquet for direct training access
    training_df = sales_df.rename(columns={"event_timestamp": "date"})
    training_df.to_parquet(f"{data_dir}/features.parquet", index=False)
    
    # Entity DataFrame for historical feature retrieval
    entities_df = sales_df[["store_id", "dept_id", "event_timestamp"]].rename(columns={"event_timestamp": "date"})
    entities_df.to_parquet(f"{data_dir}/entities.parquet", index=False)
    
    # Store features (static dimensions)
    stores_records = []
    for store_id in range(1, config["stores"] + 1):
        for dept_id in range(1, config["departments"] + 1):
            stores_records.append({
                "store_id": store_id,
                "dept_id": dept_id,
                "store_index": store_id,
                "department_index": dept_id,
                "event_timestamp": base_date,
                "store_type": config["store_types"].split(",")[store_id % len(config["store_types"].split(","))],
                "store_size": config["store_size_base"] + store_id * config["store_size_step"],
                "region": f"region_{(store_id - 1) // config['stores_per_region'] + 1}"  # 3 regions
            })
    stores_df = pd.DataFrame(stores_records)
    stores_df.to_parquet(f"{data_dir}/store_features.parquet", index=False)
    
    print("")
    print("=" * 60)
    print(f"✅ Generated {len(sales_df):,} sales records")
    print(f"   Stores: {config['stores']}, Departments: {config['departments']}")
    print(f"   Valid training rows: {valid_rows:,}")
    print(f"   Files: {data_dir}/")
    print("")
    print("📋 Feature summary:")
    print(f"   Lag: lag_1, lag_2, lag_4, lag_8")
    print(f"   Rolling: prior-only rolling_mean_4w, rolling_std_4w, sales_vs_avg")
    print(f"   Temporal: week_of_year, month, quarter, week_of_month, is_month_end")
    print(f"   Holiday: is_holiday, days_to_holiday")
    print(f"   Economic: temperature, fuel_price, cpi, unemployment")

  # Main execution script
  run.sh: |
    #!/bin/bash
    set -e
    
    DATA_DIR="${DATA_DIR:-{{DATA_DIR}}}"
    FEATURE_REPO="${FEATURE_REPO_DIR:-{{FEATURE_REPO_DIR}}}"
    
    echo ""
    echo "📋 Configuration:"
    echo "   DATA_DIR: $DATA_DIR"
    echo "   FEATURE_REPO: $FEATURE_REPO"
    echo "   Ray Mode: KubeRay (CodeFlare SDK)"
    
    # Step 1: Generate data
    echo ""
    echo "📊 Step 1: Generate Sales Data"
    echo "============================================================"
    python /scripts/data_generator.py
    
    # Step 2: Setup Feast project
    echo ""
    echo "⚙️  Step 2: Setup Feast Project"
    echo "============================================================"
    mkdir -p "$FEATURE_REPO"
    mkdir -p "$DATA_DIR/ray_storage"
    mkdir -p "$DATA_DIR/saved_datasets"
    # Clean up stale files
    rm -f "$FEATURE_REPO"/*.py "$FEATURE_REPO"/*.yaml 2>/dev/null || true
    # Copy Feast configs, features, and the shared forecast contract
    cp /scripts/feature_store.yaml "$FEATURE_REPO/"           # File-based (for apply/materialize)
    cp /scripts/feature_store_ray.yaml "$FEATURE_REPO/"       # Ray-enabled (for training)
    cp /scripts/features.py "$FEATURE_REPO/"
    cp /scripts/forecast_contract.py "$FEATURE_REPO/"
    echo "   ✅ Project: $FEATURE_REPO"
    echo "   📁 Config: feature_store.yaml (file-based)"
    echo "   📁 Config: feature_store_ray.yaml (Ray/KubeRay)"
    
    # Step 3: Apply features
    echo ""
    echo "📝 Step 3: feast apply (register features)"
    echo "============================================================"
    cd "$FEATURE_REPO"
    feast apply
    echo "   ✅ Features registered to PostgreSQL registry"
    
    # Step 4: Materialize to online store
    echo ""
    echo "🚀 Step 4: feast materialize (Populate Online Store)"
    echo "============================================================"
    echo "   Materializing features to PostgreSQL online store..."
    # Full materialization from data start to now
    # For production, use feast materialize-incremental for subsequent runs
    feast materialize {{DATA_START_DATE}}T00:00:00 $(date -u +%Y-%m-%dT%H:%M:%S)
    echo "   ✅ Features materialized to PostgreSQL online store"
    
    # Step 5: Verify one-week-ahead online forecast features
    echo ""
    echo "🔍 Step 5: Verify forecast features"
    echo "============================================================"
    python - << 'VERIFY'
    from feast import FeatureStore
    import pandas as pd
    from datetime import datetime, timezone, timedelta
    
    store = FeatureStore(repo_path=".")
    
    print("   📋 Registered Objects:")
    print(f"      Entities: {[e.name for e in store.list_entities()]}")
    print(f"      FeatureViews: {[fv.name for fv in store.list_feature_views()]}")
    print(f"      FeatureServices: {[fs.name for fs in store.list_feature_services()]}")
    
    # Online lookup with optimized features
    print("\n   🔄 Online Feature Lookup (Optimized Features):")
    online = store.get_online_features(
        features=[
            "sales_features:lag_1",
            "sales_features:rolling_mean_4w",
            "sales_features:rolling_std_4w",
            "sales_features:week_of_year",
            "sales_features:is_holiday",
            "sales_features:origin_week",
            "sales_features:target_week",
