# Feast Feature Server - REST API for online features
---
# ConfigMap for feature_store.yaml (matches feature_repo/feature_store.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{FEAST_CONFIGMAP_NAME}}
  namespace: {{DEMO_NAMESPACE}}
data:
  feature_store.yaml: |
    project: {{FEAST_PROJECT}}
    provider: local
    registry:
      registry_type: sql
      path: "${POSTGRES_URL}"
      cache_ttl_seconds: {{FEAST_REGISTRY_CACHE_TTL_SECONDS}}
    offline_store:
      type: file
    online_store:
      type: postgres
      host: {{POSTGRES_HOST}}
      port: {{POSTGRES_PORT}}
      database: {{POSTGRES_DATABASE}}
      db_schema: "{{FEAST_DB_SCHEMA}}"
      user: "{{POSTGRES_USERNAME}}"
      password: "${POSTGRES_PASSWORD}"
    entity_key_serialization_version: {{FEAST_ENTITY_KEY_SERIALIZATION_VERSION}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{FEAST_SERVER_SERVICE}}
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app: {{FEAST_SERVER_SERVICE}}
spec:
  replicas: {{FEAST_SERVER_REPLICAS}}
  selector:
    matchLabels:
      app: {{FEAST_SERVER_SERVICE}}
  template:
    metadata:
      labels:
        app: {{FEAST_SERVER_SERVICE}}
    spec:
      initContainers:
      # Install dependencies once, share via emptyDir
      - name: install-deps
        image: {{FEAST_IMAGE}}
        command:
        - pip
        - install
        - --target=/pylibs
        - -q
        - feast[postgres]=={{FEAST_SERVER_VERSION}}
        - psycopg2-binary=={{PSYCOPG2_BINARY_VERSION}}
        - grpcio=={{GRPCIO_VERSION}}
        - grpcio-health-checking=={{GRPCIO_HEALTH_CHECKING_VERSION}}
        - uvicorn=={{UVICORN_VERSION}}
        volumeMounts:
        - name: pylibs
          mountPath: /pylibs
      containers:
      - name: {{FEAST_SERVER_SERVICE}}
        image: {{FEAST_IMAGE}}
        command: ["feast"]
        args: ["serve", "-h", "0.0.0.0", "-p", "{{FEAST_SERVER_PORT}}", "--no-access-log"]
        workingDir: /feast
        env:
        - name: PYTHONPATH
          value: /pylibs
        - name: PATH
          value: /pylibs/bin:/usr/local/bin:/usr/bin:/bin
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: url
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        ports:
        - containerPort: {{FEAST_SERVER_PORT}}
          name: http
        resources:
          requests:
            cpu: {{FEAST_SERVER_CPU_REQUEST}}
            memory: {{FEAST_SERVER_MEMORY_REQUEST}}
          limits:
            cpu: {{FEAST_SERVER_CPU_LIMIT}}
            memory: {{FEAST_SERVER_MEMORY_LIMIT}}
        volumeMounts:
        - name: pylibs
          mountPath: /pylibs
        - name: {{FEAST_CONFIGMAP_NAME}}
          mountPath: /feast
        readinessProbe:
          httpGet:
            path: /health
            port: {{FEAST_SERVER_PORT}}
          initialDelaySeconds: {{FEAST_READINESS_INITIAL_DELAY_SECONDS}}
          periodSeconds: {{FEAST_READINESS_PERIOD_SECONDS}}
        livenessProbe:
          httpGet:
            path: /health
            port: {{FEAST_SERVER_PORT}}
          initialDelaySeconds: {{FEAST_LIVENESS_INITIAL_DELAY_SECONDS}}
          periodSeconds: {{FEAST_LIVENESS_PERIOD_SECONDS}}
      volumes:
      - name: pylibs
        emptyDir: {}
      - name: {{FEAST_CONFIGMAP_NAME}}
        configMap:
          name: {{FEAST_CONFIGMAP_NAME}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{FEAST_SERVER_SERVICE}}
  namespace: {{DEMO_NAMESPACE}}
spec:
  selector:
    app: {{FEAST_SERVER_SERVICE}}
  ports:
  - name: http
    port: {{FEAST_SERVER_PORT}}
---
---
# Feast UI - Web dashboard for feature exploration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{FEAST_UI_SERVICE}}
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app: {{FEAST_UI_SERVICE}}
spec:
  replicas: {{FEAST_UI_REPLICAS}}
  selector:
    matchLabels:
      app: {{FEAST_UI_SERVICE}}
  template:
    metadata:
      labels:
        app: {{FEAST_UI_SERVICE}}
    spec:
      initContainers:
      - name: install-deps
        image: {{FEAST_IMAGE}}
        command:
        - pip
        - install
        - --target=/pylibs
        - -q
        - feast[postgres]=={{FEAST_SERVER_VERSION}}
        - psycopg2-binary=={{PSYCOPG2_BINARY_VERSION}}
        - grpcio=={{GRPCIO_VERSION}}
        - grpcio-health-checking=={{GRPCIO_HEALTH_CHECKING_VERSION}}
        - grpcio-reflection=={{GRPCIO_REFLECTION_VERSION}}
        volumeMounts:
        - name: pylibs
          mountPath: /pylibs
      containers:
      - name: {{FEAST_UI_SERVICE}}
        image: {{FEAST_IMAGE}}
        command: ["feast"]
        args: ["ui", "-h", "0.0.0.0", "-p", "{{FEAST_UI_PORT}}"]
        workingDir: /feast
        env:
        - name: PYTHONPATH
          value: /pylibs
        - name: PATH
          value: /pylibs/bin:/usr/local/bin:/usr/bin:/bin
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: url
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        ports:
        - containerPort: {{FEAST_UI_PORT}}
          name: ui
        resources:
          requests:
            cpu: {{FEAST_UI_CPU_REQUEST}}
            memory: {{FEAST_UI_MEMORY_REQUEST}}
          limits:
            cpu: {{FEAST_UI_CPU_LIMIT}}
            memory: {{FEAST_UI_MEMORY_LIMIT}}
        volumeMounts:
        - name: pylibs
          mountPath: /pylibs
        - name: {{FEAST_CONFIGMAP_NAME}}
          mountPath: /feast
      volumes:
      - name: pylibs
        emptyDir: {}
      - name: {{FEAST_CONFIGMAP_NAME}}
        configMap:
          name: {{FEAST_CONFIGMAP_NAME}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{FEAST_UI_SERVICE}}
  namespace: {{DEMO_NAMESPACE}}
spec:
  selector:
    app: {{FEAST_UI_SERVICE}}
  ports:
  - name: ui
    port: {{FEAST_UI_PORT}}
---
