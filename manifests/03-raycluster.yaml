# KubeRay Cluster - Distributed processing for Feast
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{RAY_CLUSTER_NAME}}
  namespace: {{DEMO_NAMESPACE}}
  labels:
    app: {{RAY_CLUSTER_NAME}}
    ray.io/cluster: {{RAY_CLUSTER_NAME}}
spec:
  rayVersion: '{{RAY_VERSION}}'
  enableInTreeAutoscaling: false
  
  headGroupSpec:
    serviceType: {{RAY_DASHBOARD_SERVICE_TYPE}}
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '{{RAY_HEAD_CPUS}}'
      block: 'true'
      ray-client-server-port: '{{RAY_CLIENT_PORT}}'
      object-store-memory: '{{RAY_OBJECT_STORE_MEMORY}}'
    template:
      metadata:
        labels:
          app: {{RAY_CLUSTER_NAME}}
          component: head
          ray.io/cluster: {{RAY_CLUSTER_NAME}}
      spec:
        containers:
        - name: ray-head
          image: {{RAY_IMAGE}}
          ports:
          - containerPort: {{RAY_GCS_PORT}}
            name: gcs
          - containerPort: {{RAY_DASHBOARD_PORT}}
            name: dashboard
          - containerPort: {{RAY_CLIENT_PORT}}
            name: client
          resources:
            requests:
              cpu: "{{RAY_HEAD_CPU_REQUEST}}"
              memory: "{{RAY_HEAD_MEMORY_REQUEST}}"
            limits:
              cpu: "{{RAY_HEAD_CPU_LIMIT}}"
              memory: "{{RAY_HEAD_MEMORY_LIMIT}}"
          env:
          - name: FEAST_DATA_ROOT
            value: "{{DATA_DIR}}"
          volumeMounts:
          # Mount at /shared (native path)
          - name: shared-storage
            mountPath: {{POD_SHARED_ROOT}}
          # Mount at workbench path (avoids symlink hack)
          - name: shared-storage
            mountPath: {{WORKBENCH_SHARED_ROOT}}
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{SHARED_PVC_NAME}}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{RAY_SHARED_MEMORY_LIMIT}}
  
  workerGroupSpecs:
  - replicas: {{RAY_WORKER_REPLICAS}}
    minReplicas: {{RAY_WORKER_MIN_REPLICAS}}
    maxReplicas: {{RAY_WORKER_MAX_REPLICAS}}
    groupName: workers
    rayStartParams:
      num-cpus: '{{RAY_WORKER_CPUS}}'
      block: 'true'
      object-store-memory: '{{RAY_OBJECT_STORE_MEMORY}}'
    template:
      metadata:
        labels:
          app: {{RAY_CLUSTER_NAME}}
          component: worker
          ray.io/cluster: {{RAY_CLUSTER_NAME}}
      spec:
        containers:
        - name: ray-worker
          image: {{RAY_IMAGE}}
          resources:
            requests:
              cpu: "{{RAY_WORKER_CPUS}}"
              memory: "{{RAY_WORKER_MEMORY_REQUEST}}"
            limits:
              cpu: "{{RAY_WORKER_CPU_LIMIT}}"
              memory: "{{RAY_WORKER_MEMORY_LIMIT}}"
          volumeMounts:
          - name: shared-storage
            mountPath: {{POD_SHARED_ROOT}}
          - name: shared-storage
            mountPath: {{WORKBENCH_SHARED_ROOT}}
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{SHARED_PVC_NAME}}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{RAY_SHARED_MEMORY_LIMIT}}
# Service created automatically by KubeRay operator as "{{RAY_CLUSTER_NAME}}-head-svc"
