# KServe Inference - internal access service
#
# NOTE: InferenceService is created by notebook 03-inference.ipynb
# The notebook uses the predictor's ClusterIP service. Do not expose the
# unauthenticated predictor through a public Route.
---
apiVersion: v1
kind: Service
metadata:
  name: {{EXTERNAL_INFERENCE_SERVICE_NAME}}
  namespace: {{DEMO_NAMESPACE}}
spec:
  selector:
    serving.kserve.io/inferenceservice: {{MODEL_NAME}}
  ports:
  - name: http
    port: {{PREDICTOR_SERVICE_PORT}}
